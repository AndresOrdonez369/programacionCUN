<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/deck.css">
<title>Slides · Programación de Videojuegos</title>
</head>
<body class="deck" data-page="deck">
<main class="stage" id="stage"></main>
<div class="prog" id="prog"></div>
<aside class="notes" id="notes"></aside>
<div class="deckbar">
  <a id="back" href="index.html" title="Volver a la sesión"><svg class="svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg><span class="hidem">Sesión</span></a>
  <span class="kind" id="kind"></span>
  <span class="ttl" id="ttl"></span>
  <span class="pasos" id="pasos" aria-hidden="true"></span>
  <span class="cnt" id="cnt"></span>
  <button id="nbtn" title="Notas del docente (N)" aria-label="Notas del docente"><svg class="svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H10l-6 4z"/></svg></button>
  <button id="full" class="hidem" title="Pantalla completa (F)" aria-label="Pantalla completa"><svg class="svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="prev" title="Anterior" aria-label="Slide anterior"><svg class="svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button>
  <button id="next" title="Siguiente" aria-label="Slide siguiente"><svg class="svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
</div>
<script src="data/curso.js"></script>
<script src="assets/fig.js"></script>
<script src="assets/deck.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
